# Сборка PolyPlayer для Windows и публикация выпуска на GitHub.
# Запускается при каждом изменении в main: если выпуска с версией из package.json ещё нет —
# собирает установщик и плагин и публикует выпуск vX.Y.Z (тег создаётся автоматически).
# Новая версия = поднять "version" в package.json, обновить RELEASE_NOTES.md и отправить в main.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия и проверка, нужен ли выпуск
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT; Write-Host "Выпуск v$v уже есть — собирать нечего" }
          else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        if: steps.ver.outputs.skip != 'true'
        run: npm ci

      - name: Сборка программы
        if: steps.ver.outputs.skip != 'true'
        run: npx electron-builder --config builder.json --win --x64 --dir

      - name: Значок и версия в PolyPlayer.exe
        if: steps.ver.outputs.skip != 'true'
        run: node patch-exe.js "dist/win-unpacked/PolyPlayer.exe" build/icon.ico ${{ steps.ver.outputs.version }}

      - name: Плагин Stream Deck (внутрь программы и отдельным файлом)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Copy-Item app/public/keyname.js plugin/com.polyplayer.deck.sdPlugin/bin/keyname.js -Force
          node -e "const f='plugin/com.polyplayer.deck.sdPlugin/manifest.json',fs=require('fs');const m=JSON.parse(fs.readFileSync(f,'utf8'));m.Version='$v.0';fs.writeFileSync(f,JSON.stringify(m,null,2))"
          Push-Location plugin
          7z a -tzip ../dist/PolyPlayer.streamDeckPlugin com.polyplayer.deck.sdPlugin | Out-Null
          Pop-Location
          Copy-Item dist/PolyPlayer.streamDeckPlugin dist/win-unpacked/resources/PolyPlayer.streamDeckPlugin

      - name: Установщик (NSIS)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 /DVERSION=${{ steps.ver.outputs.version }} installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: Выпуск на GitHub
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $tag = "v$v"
          # PolyPlayer-Setup.exe — та же программа под постоянным именем: ссылка «скачать последнюю версию» не меняется
          Copy-Item "dist/PolyPlayer-Setup-$v.exe" "dist/PolyPlayer-Setup.exe"
          $files = @("dist/PolyPlayer-Setup-$v.exe", "dist/PolyPlayer-Setup.exe", "dist/PolyPlayer.streamDeckPlugin")
          gh release create $tag @files --title "PolyPlayer $v" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
